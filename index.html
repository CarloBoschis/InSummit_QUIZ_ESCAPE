document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  const FONT_MIME = /^(font[/]|application[/](x-)?font-|application[/]vnd\.ms-fontobject)/i;
  const MIME_TOKEN = /^[\w.+-]+[/][\w.+-]+$/;
  function toBase64(bytes) {
    let bin = '';
    for (let i = 0; i < bytes.length; i += 0x8000) {
      bin += String.fromCharCode.apply(null, bytes.subarray(i, i + 0x8000));
    }
    return btoa(bin);
  }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    // Failed resource loads (CSP-blocked links, scripts, images) fire plain
    // events at the element — warn only; real JS errors carry message/error.
    if (!e.message && !e.error && e.target && e.target !== window) {
      console.warn('[bundle] resource failed to load:',
        e.target.tagName, String(e.target.src || e.target.href || ''));
      return;
    }
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    // Nested page bundles (iframe targets). Each ships ONCE, in the ROOT
    // document's manifest; frame srcs carry an about:blank#<uuid> marker
    // instead of a substitutable uuid. Every document mints the blobs for
    // its OWN frames — from local text at the root, or text obtained from
    // its DIRECT parent over the relay protocol below — so each frame
    // navigation stays same-origin with its initiator and a deduped page
    // loads at any depth on any host, including a file:// download's
    // opaque origins (where a blob minted by one document cannot be
    // navigated to by another).
    const pageOrderEl = document.querySelector('script[type="__bundler/page_order"]');
    const pageOrder = pageOrderEl ? JSON.parse(pageOrderEl.textContent) : [];
    const pageSet = new Set(pageOrder);
    const pageTexts = {};

    // ── Nested-page text protocol (parent-chain relay) ──
    // Page bundles ship once, in the ROOT document's manifest. Every
    // document mints the blobs for its OWN frames, obtaining page text
    // through a strict parent-chain relay: a document only ever SENDS to
    // its direct parent (which, for every document the publisher's own
    // runtime minted, is another publisher document) and only ACCEPTS
    // text from that direct parent; requests from below are honored only
    // for the document's own child frames, and the ROOT never sends
    // upward at all. That last rule is load-bearing: the artifact host's
    // frame-ancestors allows claude.ai (and friends) to frame an
    // artifact, so window.top can be a FOREIGN document — a top-addressed
    // protocol would hand page uuids to that ancestor and accept forged
    // "page text" from it, minting attacker HTML as an artifact-origin
    // blob document. The chain never touches the ancestor: requests stop
    // at the root, replies are origin-addressed per hop (never '*' when
    // an origin exists), and both directions are origin-gated (on https
    // a foreign sender's origin can never equal this document's; in
    // opaque contexts — file:// — everything serializes as 'null', where
    // an embedded EXTERNAL frame still fails the gate by carrying its
    // own real origin, and a sandboxed child of such a frame is excluded
    // by the own-child-frames check plus uuid unguessability). Shape is
    // deny-by-default: one request form, one reply form, no error
    // replies.
    // window.origin is the SERIALIZED SECURITY origin ('null' in opaque
    // contexts such as a sandboxed preview iframe) — location.origin is
    // computed from the URL and stays 'https://…' even when the document
    // is sandboxed, which would misgate every opaque chain.
    const OWN_TARGET = /^https?:[/][/]/.test(window.origin || '')
      ? window.origin
      : '*';
    function trustedOrigin(e) {
      if (e.origin === window.origin) return true; // https chains; opaque==opaque
      // file:// trees: Chrome serializes the file document's origin as
      // 'file://' while the blob: documents it mints serialize as 'null',
      // so the two legitimate shapes can never string-match — accept the
      // pair in both directions. https origins never serialize as either,
      // and sender identity (own child frame / direct parent) is checked
      // separately.
      return (
        (e.origin === 'null' &&
          (window.origin === 'file://' ||
            window.location.protocol === 'file:')) ||
        (/^file:/.test(e.origin) && window.origin === 'null')
      );
    }
    // Non-empty only in the root document (nested bundles ship an empty
    // island), so it doubles as the root marker: the root answers from
    // local text and treats a miss as authoritative — never relaying to
    // its (possibly foreign) parent.
    const isPageRoot = pageOrder.length > 0;
    const blobUrls = {};
    const resourceBlobs = {};
    const UUID_SHAPE = /^[0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12}$/;
    const pendingFrames = {}; // uuid -> [{el, frag}] awaiting text for own frames
    const pendingRelays = {}; // uuid -> [childWindow] awaiting text to pass down
    function mountPage(el, frag, text) {
      const pageBlob = new Blob([text], { type: 'text/html' });
      const u = URL.createObjectURL(pageBlob);
      resourceBlobs[u] = pageBlob;
      el.src = u + frag;
    }
    function deliverPage(uuid, text) {
      const frames = pendingFrames[uuid];
      delete pendingFrames[uuid];
      if (frames) for (const f of frames) mountPage(f.el, f.frag, text);
      const relays = pendingRelays[uuid];
      delete pendingRelays[uuid];
      if (relays) {
        for (const cw of relays) {
          try { cw.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
        }
      }
    }
    function ownFrameWindows() {
      const out = [];
      for (const f of Array.from(document.querySelectorAll('iframe'))) {
        try { if (f.contentWindow) out.push(f.contentWindow); } catch (err) { /* detached */ }
      }
      return out;
    }
    window.addEventListener('message', function (e) {
      const d = e.data;
      if (!d || typeof d !== 'object' || !e.source) return;
      // Origin gate first; the structural checks below (own-child-frames
      // for requests, direct-parent + solicited-uuid for replies, the
      // root's never-relay rule) are what hold in fully opaque chains
      // where origin strings can't discriminate — a sandboxed root's
      // FOREIGN wrapper still fails all three even though both serialize
      // as real-vs-'null' rather than matching.
      if (!trustedOrigin(e)) return;
      if (typeof d.__bundler_need === 'string' && UUID_SHAPE.test(d.__bundler_need)) {
        // Requests are honored only for this document's own child frames.
        if (ownFrameWindows().indexOf(e.source) < 0) return;
        const uuid = d.__bundler_need;
        const text = pageTexts[uuid];
        if (typeof text === 'string') {
          try { e.source.postMessage({ __bundler_page: uuid, __bundler_text: text }, OWN_TARGET); } catch (err) { /* gone */ }
          return;
        }
        if (isPageRoot || window.parent === window) return; // authoritative miss
        const waiting = pendingRelays[uuid];
        if (waiting) {
          if (waiting.indexOf(e.source) < 0) waiting.push(e.source);
          return;
        }
        // Never-answered uuids would otherwise accumulate forever under a
        // request spray; past the cap (far above any real page count) new
        // relays are dropped rather than remembered.
        if (Object.keys(pendingRelays).length >= 128) return;
        pendingRelays[uuid] = [e.source];
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      } else if (
        typeof d.__bundler_page === 'string' &&
        UUID_SHAPE.test(d.__bundler_page) &&
        typeof d.__bundler_text === 'string'
      ) {
        // The shape test is load-bearing beyond tidiness: the solicited
        // check below uses the in operator, which matches prototype keys
        // ('__proto__', 'constructor') — an unshaped key would reach
        // deliverPage and throw, painting the error banner.
        // Text is accepted only from the direct parent — the document
        // that minted this one.
        if (e.source !== window.parent || window.parent === window) return;
        if (!(d.__bundler_page in pendingFrames) && !(d.__bundler_page in pendingRelays)) return;
        deliverPage(d.__bundler_page, d.__bundler_text);
      }
    });

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        if (pageSet.has(uuid)) {
          pageTexts[uuid] = new TextDecoder().decode(finalBytes);
          return;
        }
        if (FONT_MIME.test(entry.mime) && MIME_TOKEN.test(entry.mime)) {
          // Strict artifact hosts allow font-src data: but not blob:.
          blobUrls[uuid] = 'data:' + entry.mime + ';base64,' +
            (entry.compressed ? toBase64(finalBytes) : entry.data);
        } else {
          const blob = new Blob([finalBytes], { type: entry.mime });
          blobUrls[uuid] = URL.createObjectURL(blob);
          resourceBlobs[blobUrls[uuid]] = blob;
        }
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        const blob = new Blob([], { type: entry.mime });
        blobUrls[uuid] = URL.createObjectURL(blob);
        resourceBlobs[blobUrls[uuid]] = blob;
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    // Artifact-host CSP (connect-src 'self') refuses fetch() of blob: URLs —
    // consumers read these Blobs directly. Survives the swap like the error sink.
    window.__resourceBlobs = resourceBlobs;

    setStatus('Rendering...');
    // Page uuids have no blob here — they ride inside about:blank#<uuid>
    // frame markers the pass below resolves after the swap.
    for (const uuid of uuids) {
      if (pageSet.has(uuid)) continue;
      template = template.split(uuid).join(blobUrls[uuid]);
    }

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).replace(/<\//g, '<\\/') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);

    // Resolve page-frame markers: mint this document's own blob for each
    // framed page — from local text when this is the root, otherwise by
    // asking the direct parent over the relay protocol above. An
    // unanswered request leaves the frame on about:blank, the same
    // degraded state as a refused embed.
    {
      const MARKER = /^about:blank#([0-9a-f]{8}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{4}-[0-9a-f]{12})(#.*)?$/;
      const needed = [];
      for (const el of Array.from(document.querySelectorAll('iframe'))) {
        const m = MARKER.exec(el.getAttribute('src') || '');
        if (!m) continue;
        const text = pageTexts[m[1]];
        if (typeof text === 'string') {
          mountPage(el, m[2] || '', text);
        } else if (window.parent !== window && !isPageRoot) {
          const had = pendingFrames[m[1]];
          (pendingFrames[m[1]] = had || []).push({ el: el, frag: m[2] || '' });
          if (!had) needed.push(m[1]);
        }
      }
      for (const uuid of needed) {
        window.parent.postMessage({ __bundler_need: uuid }, OWN_TARGET);
      }
    }

    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: read and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const pre = resourceBlobs[s.src.split('#')[0]];
        s.textContent = pre ? await pre.text() : await (await fetch(s.src)).text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

+2020, U+20A0-20AB, U+20AD-20C4, U+2113, U+2C60-2C7F, U+A720-A7FF;\n}\n/* latin */\n@font-face {\n  font-family: 'JetBrains Mono';\n  font-style: normal;\n  font-weight: 500;\n  font-display: swap;\n  src: url(\"24d95c2d-098b-4e03-a415-6f590b9b5b07\") format('woff2');\n  unicode-range: U+0000-00FF, U+0131, U+0152-0153, U+02BB-02BC, U+02C6, U+02DA, U+02DC, U+0304, U+0308, U+0329, U+2000-206F, U+20AC, U+2122, U+2191, U+2193, U+2212, U+2215, U+FEFF, U+FFFD;\n}\n<\u002Fstyle>\n<meta name=\"theme-color\" content=\"#06111F\">\n<meta name=\"viewport\" content=\"width=device-width, initial-scale=1, viewport-fit=cover\">\n<script src=\"63af4500-0e94-4add-b5dd-19cefe0839fe\"><\u002Fscript>\n<script src=\"fc81e1b2-73a9-4c15-9da6-c0f0100b7bed\"><\u002Fscript>\n<style>\nhtml,body{margin:0;background:#02060C;-webkit-font-smoothing:antialiased}\n*{box-sizing:border-box}\nbutton{font:inherit;-webkit-tap-highlight-color:transparent}\na{color:oklch(0.86 0.08 215);text-decoration:none}\na:hover{color:#fff}\n@keyframes qpulse{0%,100%{opacity:1;transform:scale(1)}50%{opacity:.35;transform:scale(.7)}}\n@keyframes qin{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}\n<\u002Fstyle>\n<\u002Fhelmet>\n\n<div style=\"min-height:100vh; display:flex; flex-wrap:wrap; justify-content:center; align-items:flex-start; gap:{{ rootGap }}; padding:{{ rootPad }}; background:#02060C; font-family:'DM Sans',system-ui,sans-serif; color:#EAF0FA\">\n\n  <sc-if value=\"{{ showControl }}\" hint-placeholder-val=\"{{ true }}\">\n    <div style=\"display:flex; flex-direction:column; gap:14px; width:{{ fw }}; max-width:100%\">\n      <sc-if value=\"{{ framed }}\" hint-placeholder-val=\"{{ true }}\">\n        <div style=\"display:flex; justify-content:space-between; align-items:baseline; gap:12px; padding:0 6px; font:500 11px/1.4 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:rgba(234,240,250,.55)\">\n          <span>App di controllo · Regia<\u002Fspan>\n          <a href=\"?view=control\" target=\"_blank\">Apri ↗<\u002Fa>\n        <\u002Fdiv>\n      <\u002Fsc-if>\n      <div data-screen-label=\"Controllo\" style=\"position:relative; width:100%; height:{{ fh }}; border-radius:{{ fr }}; border:{{ fb }}; overflow:hidden; display:flex; flex-direction:column; background:radial-gradient(110% 55% at 90% -5%, oklch(0.36 0.11 265 / .6), transparent 62%), radial-gradient(90% 50% at -10% 105%, oklch(0.34 0.09 205 / .45), transparent 60%), #06111F\">\n        <div style=\"position:absolute; inset:0; pointer-events:none; opacity:.55; background-image:radial-gradient(1px 1px at 23px 41px, #fff, transparent), radial-gradient(1px 1px at 131px 87px, #fff, transparent), radial-gradient(1.5px 1.5px at 77px 163px, #cfe0ff, transparent), radial-gradient(1px 1px at 181px 12px, #fff, transparent), radial-gradient(1px 1px at 49px 201px, #fff, transparent); background-size:210px 230px\"><\u002Fdiv>\n\n        <div style=\"position:relative; display:flex; justify-content:space-between; align-items:center; padding:22px 24px 0\">\n          <span style=\"font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:rgba(234,240,250,.6)\">Insight Galaxy / Quiz<\u002Fspan>\n          <span style=\"display:flex; align-items:center; gap:7px; padding:6px 10px; border-radius:99px; border:1px solid rgba(234,240,250,.18); font:500 10px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.86 0.08 290)\">Regia<\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"position:relative; display:grid; grid-template-columns:repeat(5,1fr); gap:6px; padding:18px 24px 0\">\n          <sc-for list=\"{{ segs }}\" as=\"s\" hint-placeholder-count=\"5\">\n            <div style=\"height:3px; border-radius:3px; background:{{ s.bg }}; transition:background .4s\"><\u002Fdiv>\n          <\u002Fsc-for>\n        <\u002Fdiv>\n\n        <div style=\"position:relative; flex:1; min-height:0; overflow-y:auto; display:flex; flex-direction:column\">\n          <sc-if value=\"{{ hName }}\" hint-placeholder-val=\"{{ true }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:26px; padding:24px 24px 28px; animation:qin .5s ease both\">\n              <div style=\"display:flex; flex-direction:column; gap:14px\">\n                <span style=\"font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.86 0.08 215)\">Benvenuto<\u002Fspan>\n                <h1 style=\"margin:0; font:400 46px/1.02 'Instrument Serif',serif; text-wrap:pretty\">Prima di iniziare, <em style=\"color:oklch(0.86 0.08 290)\">chi sei?<\u002Fem><\u002Fh1>\n                <p style=\"margin:0; font-size:15px; line-height:1.5; color:rgba(234,240,250,.66); text-wrap:pretty\">Inserisci nome e cognome: ci servono per assegnarti la tua squadra.<\u002Fp>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:10px\">\n                <input value=\"{{ hFirstName }}\" sc-camel-on-change=\"{{ hOnFirst }}\" placeholder=\"Nome\" autocomplete=\"given-name\" style=\"width:100%; height:56px; padding:0 18px; border-radius:18px; border:1px solid rgba(234,240,250,.18); background:rgba(234,240,250,.04); color:#EAF0FA; font:400 16px 'DM Sans',sans-serif; outline:none\" style-focus=\"border-color:oklch(0.86 0.08 215)\">\n                <input value=\"{{ hLastName }}\" sc-camel-on-change=\"{{ hOnLast }}\" placeholder=\"Cognome\" autocomplete=\"family-name\" style=\"width:100%; height:56px; padding:0 18px; border-radius:18px; border:1px solid rgba(234,240,250,.18); background:rgba(234,240,250,.04); color:#EAF0FA; font:400 16px 'DM Sans',sans-serif; outline:none\" style-focus=\"border-color:oklch(0.86 0.08 215)\">\n              <\u002Fdiv>\n              <button sc-camel-on-click=\"{{ hOnNameSubmit }}\" disabled=\"{{ hNameDisabled }}\" style=\"width:100%; height:56px; border:0; border-radius:99px; background:#EAF2FF; color:#06111F; font-weight:600; font-size:16px; cursor:pointer; opacity:{{ hNameOpacity }}; transition:opacity .2s\">Continua<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hIntro }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:28px; padding:24px 24px 28px; animation:qin .5s ease both\">\n              <div style=\"display:flex; flex-direction:column; gap:14px\">\n                <span style=\"font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.86 0.08 215)\">5 domande · sessione live<\u002Fspan>\n                <h1 style=\"margin:0; font:400 46px/1.02 'Instrument Serif',serif; letter-spacing:-.01em; text-wrap:pretty\">Guida la galassia, <em style=\"color:oklch(0.86 0.08 290)\">una domanda<\u002Fem> alla volta.<\u002Fh1>\n                <p style=\"margin:0; font-size:15px; line-height:1.5; color:rgba(234,240,250,.66); text-wrap:pretty\">Quando passi alla domanda successiva, tutti i partecipanti collegati si aggiornano in tempo reale.<\u002Fp>\n              <\u002Fdiv>\n              <sc-if value=\"{{ teamsOpen }}\" hint-placeholder-val=\"{{ false }}\">\n              <div style=\"display:flex; flex-direction:column; gap:10px; padding:14px 16px; border-radius:18px; border:1px solid rgba(234,240,250,.14); background:rgba(234,240,250,.03)\">\n                <div style=\"display:flex; justify-content:space-between; align-items:center; gap:10px\">\n                  <span style=\"font:500 11px/1.3 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:rgba(234,240,250,.6)\">Elenco squadre<\u002Fspan>\n                  <span style=\"font:500 11px/1.3 'JetBrains Mono',monospace; color:{{ teamsColor }}\">{{ teamsCount }}<\u002Fspan>\n                <\u002Fdiv>\n                <span style=\"font-size:13px; line-height:1.4; color:rgba(234,240,250,.66)\">{{ teamsSource }}<\u002Fspan>\n                <label style=\"display:flex; align-items:center; justify-content:center; height:44px; border-radius:99px; border:1px solid rgba(234,240,250,.2); font-size:14px; color:#EAF0FA; cursor:pointer\">\n                  Carica file Excel\n                  <input type=\"file\" accept=\".xlsx,.xls,.csv\" sc-camel-on-change=\"{{ onTeamsFile }}\" style=\"display:none\">\n                <\u002Flabel>\n              <\u002Fdiv>\n              <\u002Fsc-if>\n              <button sc-camel-on-click=\"{{ hStart }}\" style=\"width:100%; height:56px; border:0; border-radius:99px; background:#EAF2FF; color:#06111F; font-weight:600; font-size:16px; cursor:pointer\" style-active=\"transform:scale(.98)\">Avvia il quiz<\u002Fbutton>\n              <button sc-camel-on-click=\"{{ toggleTeams }}\" style=\"align-self:center; margin-top:-14px; padding:8px 12px; border:0; background:transparent; font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.08em; text-transform:uppercase; color:rgba(234,240,250,.45); cursor:pointer\">{{ teamsToggleLabel }}<\u002Fbutton>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ hQuestion }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; gap:26px; padding:30px 24px 28px\">\n              <div style=\"display:flex; flex-direction:column; gap:12px\">\n                <span style=\"font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.86 0.08 215)\">Domanda {{ stepNum }} / 5<\u002Fspan>\n                <h2 style=\"margin:0; font:400 32px/1.1 'Instrument Serif',serif; text-wrap:pretty\">{{ qText }}<\u002Fh2>\n              <\u002Fdiv>\n              <div style=\"display:flex; flex-direction:column; gap:10px\">\n                <sc-for list=\"{{ hostOptions }}\" as=\"o\" hint-placeholder-count=\"4\">\n                  <button sc-camel-on loadMsg }}<\u002Fh1>\n              <div style=\"display:flex; flex-direction:column; gap:10px\">\n                <div style=\"height:4px; border-radius:4px; background:rgba(234,240,250,.12); overflow:hidden\">\n                  <div style=\"height:100%; width:{{ loadPct }}; border-radius:4px; background:oklch(0.86 0.08 215); transition:width .3s linear\"><\u002Fdiv>\n                <\u002Fdiv>\n                <div style=\"display:flex; justify-content:space-between; font:500 11px/1 'JetBrains Mono',monospace; color:rgba(234,240,250,.55)\">\n                  <span>{{ fullName }}<\u002Fspan><span>{{ loadPct }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n\n          <sc-if value=\"{{ pTeam }}\" hint-placeholder-val=\"{{ false }}\">\n            <div style=\"flex:1; display:flex; flex-direction:column; justify-content:flex-end; gap:24px; padding:24px 24px 36px; animation:qin .6s ease both\">\n              <div style=\"display:flex; flex-direction:column; gap:14px\">\n                <span style=\"font:500 11px/1 'JetBrains Mono',monospace; letter-spacing:.1em; text-transform:uppercase; color:oklch(0.86 0.08 215)\">Grazie per le tue risposte, {{ firstName }}<\u002Fspan>\n                <p style=\"margin:0; font-size:15px; line-height:1.5; color:rgba(234,240,250,.66)\">{{ teamIntro }}<\u002Fp>\n                <h1 style=\"margin:0; font:400 58px/1 'Instrument Serif',serif; letter-spacing:-.01em; color:oklch(0.86 0.08 290); text-wrap:balance\">{{ teamName }}<\u002Fh1>\n              <\u002Fdiv>\n              <p style=\"margin:0; padding-top:18px; border-top:1px solid rgba(234,240,250,.12); font-size:14px; line-height:1.5; color:rgba(234,240,250,.66); text-wrap:pretty\">{{ teamNote }}<\u002Fp>\n            <\u002Fdiv>\n          <\u002Fsc-if>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;view&quot;:{&quot;editor&quot;:&quot;enum&quot;,&quot;options&quot;:[&quot;both&quot;,&quot;control&quot;,&quot;player&quot;],&quot;default&quot;:&quot;both&quot;,&quot;tsType&quot;:&quot;'both'|'control'|'player'&quot;},&quot;loadSeconds&quot;:{&quot;editor&quot;:&quot;range&quot;,&quot;min&quot;:3,&quot;max&quot;:60,&quot;step&quot;:1,&quot;unit&quot;:&quot;s&quot;,&quot;default&quot;:45,&quot;tsType&quot;:&quot;number&quot;}}\">\nconst QUESTIONS = [1, 2, 3, 4, 5].map(n => ({\n  text: `Testo della domanda ${n} — placeholder in attesa del contenuto definitivo?`,\n  options: ['Risposta A — placeholder', 'Risposta B — placeholder', 'Risposta C — placeholder', 'Risposta D — placeholder']\n}));\nconst KEY = 'insummit-quiz-step';\nconst ACC = 'oklch(0.86 0.08 215)';\nconst SB_URL = 'https://dorharwzjhgcrjcevhwl.supabase.co';\nconst SB_KEY = 'sb_publishable_ZwH3amImnAncM5j6hnQaww_XanFKPu8';\nconst SB_CHANNEL = 'insummit-quiz';\n// File squadre: xlsx/csv accanto a index.html, oppure link Google Sheets pubblicato (…/pub?output=xlsx)\nconst TEAMS_URL = './squadre.xlsx';\nconst keysFor = name => { const n = norm(name); if (!n) return []; return [n, n.split(' ').sort().join(' ')]; };\nconst NAME_KEY = 'insummit-quiz-name';\nconst LOAD_MSGS = ['Stiamo analizzando le tue risposte…', 'Confrontiamo il tuo profilo con la community…', 'Allineiamo le costellazioni…', 'Ci siamo quasi…'];\nconst ROLE0 = { phase: 'recap', first: '', last: '', named: false, progress: 0, team: null };\nconst TEAMS_KEY = 'insummit-quiz-teams';\nconst EMBEDDED_TEAMS = [[\"Mario Rossi\",\"Squadra Orione\"],[\"Giulia Bianchi\",\"Squadra Andromeda\"],[\"Luca Verdi\",\"Squadra Cassiopea\"],[\"Sara Neri\",\"Squadra Orione\"]];\nconst norm = s => String(s || '').normalize('NFD').replace(/[\\u0300-\\u036f]/g, '').toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();\n\nclass Component extends DCLogic {\n  state = { step: 0, hostSel: {}, playerSel: {}, h: { ...ROLE0 }, p: { ...ROLE0 } };\n  setRole(r, patch) { this.setState(s => ({ [r]: { ...s[r], ...patch } })); }\n\n  rowsFromBuffer(buf, isCsv) {\n    let rows;\n    if (isCsv || !window.XLSX) {\n      const txt = new TextDecoder().decode(buf).replace(/^\\ufeff/, '');\n      const sep = (txt.split('\\n')[0].match(/;/g) || []).length > (txt.split('\\n')[0].match(/,/g) || []).length ? ';' : ',';\n      rows = txt.split(/\\r?\\n/).map(l => l.split(sep).map(c => c.replace(/^\"|\"$/g, '')));\n    } else {\n      const wb = window.XLSX.read(buf, { type: 'array' });\n      rows = window.XLSX.utils.sheet_to_json(wb.Sheets[wb.SheetNames[0]], { header: 1, defval: '' });\n    }\n    return rows.map(r => r.map(c => String(c).trim()).filter(Boolean)).filter(r => r.length >= 2)\n      .filter(r => !/^nome/i.test(r[0]) || !/squadr|team/i.test(r[r.length - 1]))\n      .map(r => [r.slice(0, -1).join(' '), r[r.length - 1]]);\n  }\n  setTeams(rows, source, persist) {\n    if (!rows || !rows.length) return false;\n    const map = {};\n    rows.forEach(([name, team]) => keysFor(name).forEach(k => { map[k] = team; }));\n    this.teams = map; this.teamRows = rows;\n    if (persist) { try { localStorage.setItem(TEAMS_KEY, JSON.stringify({ rows, source })); } catch (e) {} }\n    this.setState({ teamsN: rows.length, teamsSrc: source });\n    return true;\n  }\n  lookupTeam(first, last) {\n    const m = this.teams || {};\n    for (const k of keysFor(first + ' ' + last)) if (m[k]) return m[k];\n    return null;\n  }\n  initTeams() {\n    let cached = null;\n    try { cached = JSON.parse(localStorage.getItem(TEAMS_KEY) || 'null'); } catch (e) {}\n    if (!(cached && this.setTeams(cached.rows, cached.source))) this.setTeams(EMBEDDED_TEAMS, 'embedded');\n    const isCsv = /\\.csv|output=csv/i.test(TEAMS_URL);\n    const sep = TEAMS_URL.includes('?') ? '&' : '?';\n    fetch(TEAMS_URL + sep + 't=' + Date.now(), { cache: 'no-store' })\n      .then(r => { if (!r.ok) throw new Error(r.status); return r.arrayBuffer(); })\n      .then(buf => this.setTeams(this.rowsFromBuffer(buf, isCsv), 'file', true))\n      .catch(e => console.warn('squadre.xlsx non raggiungibile, uso elenco incorporato', e));\n  }\n  onTeamsFile(e) {\n    const f = e.target.files && e.target.files[0];\n    if (!f) return;\n    f.arrayBuffer().then(buf => {\n      const rows = this.rowsFromBuffer(buf, /\\.csv$/i.test(f.name));\n      if (!this.setTeams(rows, 'upload', true)) { alert('Nessun nome trovato nel file. Colonna A: Nome Cognome, colonna B: Squadra.'); return; }\n      this.sendTeams();\n    });\n    e.target.value = '';\n  }\n  sendTeams() {\n    this.ch && this.isHost() && this.teamRows && this.ch.send({ type: 'broadcast', event: 'teams', payload: { rows: this.teamRows } });\n  }\n  startLoading(r) {\n    const secs = this.props.loadSeconds ?? 45;\n    const t0 = Date.now();\n    this.timers = this.timers || {};\n    clearInterval(this.timers[r]);\n    this.setRole(r, { phase: 'loading', progress: 0, team: null });\n    this.timers[r] = setInterval(() => {\n      const p = Math.min(1, (Date.now() - t0) / (secs * 1000));\n      this.setRole(r, { progress: p });\n      if (p >= 1) {\n        clearInterval(this.timers[r]);\n        const s = this.state[r]; this.setRole(r, { phase: 'team', team: this.lookupTeam(s.first, s.last) });\n      }\n    }, 250);\n  }\n  resetRole(r) { this.timers && clearInterval(this.timers[r]); this.setRole(r, { phase: 'recap', progress: 0, team: null }); }\n  roleVals(r) {\n    const s = this.state[r];\n    const ok = s.first.trim().length > 0 && s.last.trim().length > 0;\n    return {\n      firstName: s.first, lastName: s.last, fullName: (s.first + ' ' + s.last).trim(),\n      onFirst: e => this.setRole(r, { first: e.target.value }),\n      onLast: e => this.setRole(r, { last: e.target.value }),\n      nameDisabled: !ok, nameOpacity: ok ? 1 : 0.35,\n      onNameSubmit: () => {\n        if (!ok) return;\n        const n = { first: s.first.trim(), last: s.last.trim() };\n        this.setRole(r, { ...n, named: true });\n      },\n      loadPct: Math.round(s.progress * 100) + '%',\n      loadMsg: LOAD_MSGS[Math.min(LOAD_MSGS.length - 1, Math.floor(s.progress * LOAD_MSGS.length))],\n      teamIntro: s.team ? 'La tua squadra è' : 'Non abbiamo trovato il tuo nome nell’elenco.',\n      teamName: s.team || 'Rivolgiti allo staff',\n      teamNote: s.team ? 'Raggiungi i tuoi compagni di squadra: vi aspettiamo per la prossima attività.' : `Controlla di aver scritto correttamente nome e cognome (${s.first} ${s.last}) oppure chiedi al personale InSummit.`\n    };\n  }\n\n  componentDidMount() {\n    this.initTeams();\n    const s = parseInt(localStorage.getItem(KEY) || '0', 10);\n    if (!isNaN(s)) this.setState({ step: s });\n    this.onStorage = e => { if (e.key === KEY) this.applyRemote(parseInt(e.newValue || '0', 10)); };\n    window.addEventListener('storage', this.onStorage);\n    try { this.bc = new BroadcastChannel(KEY); this.bc.onmessage = e => this.applyRemote(e.data); } catch (e) {}\n    this.lastTs = parseInt(localStorage.getItem(KEY + '-ts') || '0', 10) || 0;\n    if (this.viewMode() !== 'both') this.initRealtime();\n  }\n  viewMode() {\n    const q = new URLSearchParams(location.search).get('view');\n    if (q) return q;\n    const p = location.pathname.toLowerCase();\n    if (/\\/regia\\/?$/.test(p)) return 'control';\n    if (/\\/live\\/?$/.test(p)) return 'player';\n    return this.props.view || 'both';\n  }\n  isHost() { return this.viewMode() === 'control'; }\n  initRealtime(tries = 0) {\n    if (!window.supabase) { if (tries < 100) this.rtTimer = setTimeout(() => this.initRealtime(tries + 1), 100); return; }\n    const sb = window.supabase.createClient(SB_URL, SB_KEY);\n    this.sb = sb;\n    const ch = sb.channel(SB_CHANNEL, { config: { broadcast: { self: false } } });\n    this.ch = ch;\n    ch.on('broadcast', { event: 'step' }, ({ payload }) => {\n      if (this.isHost() || !payload || typeof payload.step !== 'number') return;\n      const ts = payload.ts || 0;\n      if (ts < this.lastTs) return;\n      this.lastTs = ts;\n      if (payload.step !== this.state.step) this.applyRemote(payload.step);\n    });\n    ch.on('broadcast', { event: 'sync' }, () => { if (this.isHost()) { this.sendStep(); this.sendTeams(); } });\n    ch.on('broadcast', { event: 'teams' }, ({ payload }) => { if (!this.isHost() && payload) this.setTeams(payload.rows, 'upload', true); });\n    ch.subscribe(status => {\n      if (status !== 'SUBSCRIBED') return;\n      if (this.isHost()) {\n        this.sendStep(); this.sendTeams();\n        this.hb = setInterval(() => this.sendStep(), 4000);\n      } else {\n        ch.send({ type: 'broadcast', event: 'sync', payload: {} });\n      }\n    });\n  }\n  sendStep() {\n    this.ch && this.ch.send({ type: 'broadcast', event: 'step', payload: { step: this.state.step, ts: this.lastTs } });\n  }\n  componentWillUnmount() {\n    window.removeEventListener('storage', this.onStorage);\n    this.bc && this.bc.close();\n    clearTimeout(this.rtTimer); clearInterval(this.hb); this.timers && Object.values(this.timers).forEach(clearInterval);\n    this.sb && this.ch && this.sb.removeChannel(this.ch);\n  }\n  applyRemote(step) {\n    if (this.state.p.phase === 'loading' || this.state.p.phase === 'team') return;\n    if (step === 0) { this.resetRole('p'); this.setState({ step, playerSel: {} }); }\n    else this.setState({ step });\n  }\n  setStep(step) {\n    this.lastTs = Date.now();\n    try { localStorage.setItem(KEY, String(step)); localStorage.setItem(KEY + '-ts', String(this.lastTs)); } catch (e) {}\n    this.bc && this.bc.postMessage(step);\n    this.ch && this.isHost() && this.ch.send({ type: 'broadcast', event: 'step', payload: { step, ts: this.lastTs } });\n    if (step === 0) { this.resetRole('h'); this.resetRole('p'); this.setState({ step, hostSel: {}, playerSel: {} }); }\n    else this.setState({ step });\n    if (step === 6) this.startLoading('h');\n  }\n  options(sel, key, q) {\n    return QUESTIONS[q - 1].options.map((label, i) => {\n      const on = sel[q] === i;\n      return {\n        label, letter: 'ABCD'[i],\n        border: on ? ACC : 'rgba(234,240,250,.14)',\n        bg: on ? 'oklch(0.86 0.08 215 / .12)' : 'rgba(234,240,250,.03)',\n        badgeBg: on ? ACC : 'transparent',\n        badgeColor: on ? '#06111F' : 'rgba(234,240,250,.7)',\n        onClick: () => this.setState(s => ({ [key]: { ...s[key], [q]: i } }))\n      };\n    });\n  }\n  renderVals() {\n    const view = this.viewMode();\n    const framed = view === 'both';\n    const { step, hostSel, playerSel, h, p } = this.state;\n    const hv = this.roleVals('h');\n    const hPref = {}; Object.keys(hv).forEach(k => { hPref['h' + k[0].toUpperCase() + k.slice(1)] = hv[k]; });\n    const inQ = step >= 1 && step <= 5;\n    const q = inQ ? step : 1;\n    const answered = playerSel[q] !== undefined;\n    return {\n      framed,\n      showControl: view !== 'player',\n      showPlayer: view !== 'control',\n      rootGap: framed ? '56px' : '0',\n      rootPad: framed ? '48px 32px' : '0',\n      fw: framed ? '390px' : '100%',\n      fh: framed ? '844px' : '100dvh',\n      fr: framed ? '44px' : '0',\n      fb: framed ? '1px solid rgba(234,240,250,.12)' : '0',\n      segs: [1, 2, 3, 4, 5].map(n => ({ bg: n < step || step === 6 ? 'rgba(234,240,250,.85)' : n === step ? ACC : 'rgba(234,240,250,.14)' })),\n      stepNum: q,\n      qText: QUESTIONS[q - 1].text,\n      ...hPref, ...this.roleVals('p'),\n      hName: !h.named,\n      hIntro: h.named && step === 0, hQuestion: h.named && inQ,\n      hEndIdle: h.named && step === 6 && h.phase === 'recap',\n      hLoading: h.named && step === 6 && h.phase === 'loading',\n      hTeam: h.named && step === 6 && h.phase === 'team',\n      hostOptions: this.options(hostSel, 'hostSel', q),\n      hStart: () => this.setStep(1),\n      hBack: () => this.setStep(Math.max(0, step - 1)),\n      hNext: () => hostSel[q] !== undefined && this.setStep(step + 1),\n      hNextDisabled: hostSel[q] === undefined,\n      hNextOpacity: hostSel[q] === undefined ? 0.35 : 1,\n      hNextLabel: step === 5 ? 'Invia risposte' : 'Avanti',\n      hReset: () => this.setStep(0),\n      teamsCount: (this.state.teamsN || 0) + ' nomi',\n      teamsColor: this.state.teamsN ? 'oklch(0.8 0.14 155)' : 'oklch(0.75 0.15 30)',\n      teamsSource: ({ upload: 'Caricato dalla regia e inviato a tutti i partecipanti.', file: 'Letto da squadre.xlsx sul sito.', embedded: 'Elenco incorporato nell’app.' })[this.state.teamsSrc] || 'Nessun elenco caricato.',\n      onTeamsFile: e => this.onTeamsFile(e),\n      teamsOpen: !!this.state.teamsOpen,\n      toggleTeams: () => this.setState(s => ({ teamsOpen: !s.teamsOpen })),\n      teamsToggleLabel: this.state.teamsOpen ? 'Chiudi elenco squadre' : 'Gestisci elenco squadre',\n      pName: !p.named,\n      pWait: p.named && step === 0,\n      pQuestion: p.named && inQ,\n      pRecap: p.named && step === 6 && p.phase === 'recap',\n      pLoading: p.named && p.phase === 'loading',\n      pTeam: p.named && p.phase === 'team',\n      playerOptions: this.options(playerSel, 'playerSel', q),\n      pStatus: answered ? 'Risposta registrata · attendi la prossima domanda' : 'Seleziona una risposta',\n      recap: QUESTIONS.map((qq, i) => {\n        const a = playerSel[i + 1];\n        return { n: String(i + 1).padStart(2, '0'), answer: a === undefined ? 'Nessuna risposta' : qq.options[a], color: a === undefined ? 'rgba(234,240,250,.45)' : '#EAF0FA' };\n      }),\n      pSubmit: () => this.startLoading('p')\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
